<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Koneksi Terputus - Honda Customer Rewards</title>
        <meta name="theme-color" content="#DD0101" />
        <link rel="icon" type="image/png" href="/images/logo/anper_sartika_logo_redbg_white_1x1_512.png" />
        <style>
            :root {
                --bg: #fafafa;
                --card-bg: #ffffff;
                --text-primary: #18181b;
                --text-secondary: #71717a;
                --border: #e4e4e7;
                --brand-red: #dc2626;
                --brand-red-hover: #b91c1c;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #09090b;
                    --card-bg: #18181b;
                    --text-primary: #f4f4f5;
                    --text-secondary: #a1a1aa;
                    --border: #27272a;
                }
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                    Helvetica, Arial, sans-serif;
                background-color: var(--bg);
                color: var(--text-primary);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
                text-align: center;
            }

            .container {
                max-width: 440px;
                width: 100%;
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 1.5rem;
                padding: 2.5rem 1.75rem;
                box-shadow:
                    0 20px 25px -5px rgba(0, 0, 0, 0.1),
                    0 8px 10px -6px rgba(0, 0, 0, 0.1);
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 0.375rem;
                padding: 0.25rem 0.75rem;
                border-radius: 9999px;
                background: rgba(220, 38, 38, 0.1);
                color: var(--brand-red);
                font-size: 0.75rem;
                font-weight: 700;
                margin-bottom: 1.5rem;
            }

            .icon-circle {
                width: 72px;
                height: 72px;
                border-radius: 1.25rem;
                background: rgba(220, 38, 38, 0.08);
                border: 1px solid rgba(220, 38, 38, 0.2);
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 1.5rem;
                color: var(--brand-red);
            }

            h1 {
                font-size: 1.35rem;
                font-weight: 800;
                letter-spacing: -0.025em;
                margin-bottom: 0.5rem;
                color: var(--text-primary);
            }

            p {
                font-size: 0.875rem;
                line-height: 1.5;
                color: var(--text-secondary);
                margin-bottom: 1.75rem;
            }

            .btn-retry {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                width: 100%;
                height: 2.75rem;
                border-radius: 0.875rem;
                background: var(--brand-red);
                color: #ffffff;
                font-size: 0.875rem;
                font-weight: 700;
                border: none;
                cursor: pointer;
                transition: all 0.2s ease;
                box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.25);
            }

            .btn-retry:hover {
                background: var(--brand-red-hover);
                transform: translateY(-1px);
            }

            .btn-retry:active {
                transform: scale(0.98);
            }

            .footer-note {
                margin-top: 1.5rem;
                font-size: 0.75rem;
                color: var(--text-secondary);
                opacity: 0.8;
            }

            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #f59e0b;
                display: inline-block;
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.4;
                    transform: scale(0.85);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="badge">
                <span class="status-dot"></span>
                <span>MODE OFFLINE</span>
            </div>

            <div class="icon-circle">
                <!-- Offline WiFi Slash Icon -->
                <svg
                    width="36"
                    height="36"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                    <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>

            <h1>Koneksi Terputus</h1>
            <p>
                Anda sedang tidak terhubung ke jaringan internet. Halaman ini
                akan otomatis dimuat ulang begitu koneksi internet Anda kembali
                aktif.
            </p>

            <button class="btn-retry" onclick="checkConnection()">
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path
                        d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"
                    ></path>
                    <path d="M3 3v5h5"></path>
                    <path
                        d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"
                    ></path>
                    <path d="M16 21h5v-5"></path>
                </svg>
                <span>Coba Muat Ulang</span>
            </button>

            <div class="footer-note">
                CV Anugerah Perdana &bull; Honda Customer Rewards
            </div>
        </div>

        <script>
            function checkConnection() {
                if (navigator.onLine) {
                    window.location.reload();
                } else {
                    const btn = document.querySelector('.btn-retry span');
                    const orig = btn.textContent;
                    btn.textContent = 'Masih Offline...';
                    setTimeout(() => {
                        btn.textContent = orig;
                    }, 1500);
                }
            }

            // Auto reload when internet is restored
            window.addEventListener('online', () => {
                window.location.reload();
            });
        </script>
    </body>
</html>
